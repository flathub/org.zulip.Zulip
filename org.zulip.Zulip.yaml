app-id: org.zulip.Zulip
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
modules:
  - name: zulip
    buildsystem: simple
    build-options:
      append-path: /run/build/zulip/bin:/usr/lib/sdk/node24/bin
    subdir: main
    build-commands:
      - mkdir ../bin
      - ln -s ../pnpm/pnpm ../bin/pnpm
      - cat ../pnpm-workspace.yaml >> pnpm-workspace.yaml
      - "echo 'trustLockfile: true' >> pnpm-workspace.yaml"
      - pnpm install --frozen-lockfile --ignore-scripts --offline
      - npm_package_config_node_gyp_nodedir="$FLATPAK_BUILDER_BUILDDIR/flatpak-node/cache/node-gyp/45.1.0" node --run postinstall
      - |
        set -eux
        . ../flatpak-node/electron-builder-arch-args.sh
        export XDG_CACHE_HOME="$FLATPAK_BUILDER_BUILDDIR/flatpak-node/cache"
        node --run pack -- $ELECTRON_BUILDER_ARCH_ARGS --linux --config.electronDownload.unsafelyDisableChecksums=true
      - mv dist/linux*-unpacked $FLATPAK_DEST/main
      - install -D -m 644 build/zulip.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/$FLATPAK_ID.png
      - install -D -m 755 -t $FLATPAK_DEST/bin ../run.sh
      - install -D -m 644 -t $FLATPAK_DEST/share/applications ../$FLATPAK_ID.desktop
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo ../$FLATPAK_ID.metainfo.xml
    sources:
      - type: git
        dest: main
        url: https://github.com/zulip/zulip-desktop.git
        tag: v5.14.2
        commit: 308ea3b248badd4664d533afe08427022563536e
        x-checker-data:
          type: json
          url: https://api.github.com/repos/zulip/zulip-desktop/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.16.1.tgz
        sha512: 25a45de60371c1d34604192b645b7c6e49eb2b86261d52415b424c8544347c9d1d118a7a0b6193f44c5a0aa38ef04c18132a8cfa3a4a80920afbc585689cb77b
        only-arches: [aarch64]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-ppc64/-/exe.linux-ppc64-12.16.1.tgz
        sha512: 167495d09bf8d12d5c32feef14d5b0beed17e7aecb79ce0be0709179a777085703eb340335b1b0f35b3c3796dc28f6a1b4f0fd02956e86c6e6142c78af0e9133
        only-arches: [ppc64le]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-riscv64/-/exe.linux-riscv64-12.16.1.tgz
        sha512: 0b54b0c3814de48b6d0f86ad4518402a642d486595a74e1900a3713bca5fbb66e444fc0e5beeeffb60c7d57b355be919618a4ef3a0580ef51c69d79f17e02069
        only-arches: [riscv64]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-s390x/-/exe.linux-s390x-12.16.1.tgz
        sha512: 927d9f6aeb6c4dcc4830e0e8a2f415a99c9fa4345d3601a4a1e56a35dacaa9b78106fac497e7d72e49998aae710e1b752ccaf8b1888235cb0c7cd313e893c59a
        only-arches: [s390x]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.16.1.tgz
        sha512: 44affff192dc5c65bc03693c6d039764304dd50bbddb33787589c6d5bce3d73a10d5f919ea337367502f5edb1f19599aefde4226dbe8685e5b2d77f897f14853
        only-arches: [x86_64]
      - generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - set -eu
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper.sh /app/main/zulip "$@"
      - type: file
        path: org.zulip.Zulip.desktop
      - type: file
        path: org.zulip.Zulip.metainfo.xml
