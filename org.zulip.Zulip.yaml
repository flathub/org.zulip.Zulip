app-id: org.zulip.Zulip
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
modules:
  - name: zulip
    buildsystem: simple
    build-options:
      append-path: /run/build/zulip/bin:/usr/lib/sdk/node24/bin
    subdir: main
    build-commands:
      - mkdir ../bin
      - ln -s ../pnpm/pnpm ../bin/pnpm
      - cat ../pnpm-workspace.yaml >> pnpm-workspace.yaml
      - pnpm store add --trust-lockfile ../flatpak-node/pnpm-tarballs
      - pnpm install --frozen-lockfile --ignore-scripts --offline --trust-lockfile
      - npm_package_config_node_gyp_nodedir="$FLATPAK_BUILDER_BUILDDIR/flatpak-node/cache/node-gyp/45.4.1" node --run postinstall
      - |
        set -eux
        . ../flatpak-node/electron-builder-arch-args.sh
        export XDG_CACHE_HOME="$FLATPAK_BUILDER_BUILDDIR/flatpak-node/cache"
        node --run pack -- $ELECTRON_BUILDER_ARCH_ARGS --linux --config.electronDownload.unsafelyDisableChecksums=true
      - mv dist/linux*-unpacked $FLATPAK_DEST/main
      - install -D -m 644 build/zulip.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/$FLATPAK_ID.png
      - install -D -m 755 -t $FLATPAK_DEST/bin ../run.sh
      - install -D -m 644 -t $FLATPAK_DEST/share/applications ../$FLATPAK_ID.desktop
      - install -D -m 644 -t $FLATPAK_DEST/share/metainfo ../$FLATPAK_ID.metainfo.xml
    sources:
      - type: git
        dest: main
        url: https://github.com/zulip/zulip-desktop.git
        tag: v5.14.3
        commit: 4a5471e967047fd30325a1f4c865710af7287629
        x-checker-data:
          type: json
          url: https://api.github.com/repos/zulip/zulip-desktop/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.23.0.tgz
        sha512: 44b6f2f13d0221601b963adb9a3697e92dcf6213079cb6d4a7e20370e999218d7ffb0cbc849a10a6330f66557854920697c9592945edc4970b2765d9d73d9257
        only-arches: [aarch64]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-ppc64/-/exe.linux-ppc64-12.23.0.tgz
        sha512: d61f7e981a5d9a5140e4b5ba7c07dde549cb8076a436412c4b547aee611763527a58b2e765c58526cec26dd7b4043d37e0245351af7d31a20b02e4acd8445fed
        only-arches: [ppc64le]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-riscv64/-/exe.linux-riscv64-12.23.0.tgz
        sha512: 4a53f3d94c54b21231832051293d0f1e7718af6a48a053b17fa591ebc1c29211a60121a58d89586304557de7e0a083cceb4df1e057207bdfc1d59dda22ad5b49
        only-arches: [riscv64]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-s390x/-/exe.linux-s390x-12.23.0.tgz
        sha512: 1e4f23298d22f6c8f228f245602ef596eeccab96a16f9b164f6cc2a8dc73cc10ab8afbc2aafe4655f66eacb1130b94ec4aeb04f53456169ca72e01be89a5e648
        only-arches: [s390x]
      - type: archive
        dest: pnpm
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.23.0.tgz
        sha512: beefcdd67509c4b034208ba66f12ffad1ea578603efbe4906345cbfb928f2753b6932bf32682d060bd626cb18eed346ab19f74c1c95ba047612085afaf742c8a
        only-arches: [x86_64]
      - generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - set -eu
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper.sh /app/main/zulip "$@"
      - type: file
        path: org.zulip.Zulip.desktop
      - type: file
        path: org.zulip.Zulip.metainfo.xml
